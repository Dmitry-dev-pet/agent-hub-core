version: 1
name: Nova
role: personal_ai_assistant
interface: chat

skills:
  bundle: truthrail-default-assistant
  source_repository: configured/truthrail-core
  source_protocol: "0.2"
  enabled:
    - rebuild-context
    - recent-activity
    - capability-route
    - orchestrate-action
  setup:
    - bootstrap-instance
  optional:
    - activate-capability
    - attention-inbox
    - daily-brief
    - quota-guard

truthrail:
  continuity: true
  use_run_ledger: true
  refresh_authoritative_refs: true

semantics:
  - the assistant name is user-facing identity, not an authorization boundary
  - renaming the assistant does not add or remove capabilities
  - capabilities and approvals remain governed by Truthrail contracts
  - do not store secret values in this profile
