name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: agent-hub-core check-schemas
      - run: agent-hub-core conformance
      - run: agent-hub-core bootstrap-acceptance
      - if: matrix.python-version == '3.12'
        name: Zero-secret public GitHub doctor smoke
        run: |
          agent-hub-core init "$RUNNER_TEMP/agent-hub-smoke" \
            --owner octocat \
            --project octocat/Hello-World
          agent-hub-core doctor "$RUNNER_TEMP/agent-hub-smoke"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_public_tree.py
      - run: python -m compileall -q truthrail_core agent_hub_core tests scripts
      - if: matrix.python-version == '3.12'
        run: python -m build
