name: Cross-vendor Agent Hub demo

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: cross-vendor-agent-hub-demo
  cancel-in-progress: false

jobs:
  increment:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[demo-increment] ')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate request and update public state
        id: update
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          prefix = "[demo-increment] "
          title = os.environ["ISSUE_TITLE"]
          if not title.startswith(prefix):
              raise SystemExit("unexpected issue title")

          client = title[len(prefix):].strip().lower()
          if not re.fullmatch(r"[a-z0-9][a-z0-9._-]{0,31}", client):
              raise SystemExit("client must be a short lowercase slug")

          body = json.loads(os.environ.get("ISSUE_BODY") or "{}")
          if body != {"confirm": "DEMO_INCREMENT"}:
              raise SystemExit('issue body must be exactly {"confirm":"DEMO_INCREMENT"}')

          path = Path("demo/state.json")
          state = json.loads(path.read_text(encoding="utf-8"))
          counter = int(state.get("counter", 0)) + 1
          issue_number = int(os.environ["ISSUE_NUMBER"])

          history = list(state.get("history") or [])
          history.append({
              "sequence": counter,
              "operation": "demo.increment",
              "client": client,
              "issue": issue_number,
              "requested_at": os.environ["ISSUE_CREATED_AT"],
              "execution_level": "L2"
          })
          state["counter"] = counter
          state["history"] = history
          path.write_text(json.dumps(state, indent=2) + "\n", encoding="utf-8")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(f"client={client}\n")
              fh.write(f"counter={counter}\n")
              fh.write(f"issue_number={issue_number}\n")
          PY

      - name: Commit provider-managed state change
        id: commit
        shell: bash
        env:
          CLIENT: ${{ steps.update.outputs.client }}
          ISSUE_NUMBER: ${{ steps.update.outputs.issue_number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/state.json
          git commit -m "demo: increment via ${CLIENT} (#${ISSUE_NUMBER})"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify authoritative default-branch state
        shell: bash
        env:
          EXPECTED_CLIENT: ${{ steps.update.outputs.client }}
          EXPECTED_COUNTER: ${{ steps.update.outputs.counter }}
          EXPECTED_ISSUE: ${{ steps.update.outputs.issue_number }}
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:demo/state.json > "$RUNNER_TEMP/verified-state.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = json.loads(
              Path(os.environ["RUNNER_TEMP"], "verified-state.json").read_text(encoding="utf-8")
          )
          expected_counter = int(os.environ["EXPECTED_COUNTER"])
          expected_issue = int(os.environ["EXPECTED_ISSUE"])
          expected_client = os.environ["EXPECTED_CLIENT"]

          if state.get("counter") != expected_counter:
              raise SystemExit("default-branch counter did not match")
          latest = (state.get("history") or [])[-1]
          if latest.get("issue") != expected_issue or latest.get("client") != expected_client:
              raise SystemExit("default-branch receipt did not match request")
          PY

      - name: Publish receipt and close request
        uses: actions/github-script@v8
        env:
          CLIENT: ${{ steps.update.outputs.client }}
          COUNTER: ${{ steps.update.outputs.counter }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const issue = context.payload.issue;
            const commitUrl =
              `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${process.env.COMMIT_SHA}`;
            const body = [
              'Agent Hub demo execution verified.',
              '',
              `- operation: \`demo.increment\``,
              `- client: \`${process.env.CLIENT}\``,
              `- counter: \`${process.env.COUNTER}\``,
              `- commit: ${commitUrl}`,
              '- verification: default-branch state contains this issue and client',
              '- custom secrets: none'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed'
            });
